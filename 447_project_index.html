<!DOCTYPE html>
<html>

<!--
 * ===[ SECTION 02 ]=================================== *
 * HTML Head                                            *
 * ==================================================== */ 
-->

<head>
    <title>Database Project</title>
    <link rel="stylesheet" href="447_project_style.css">
</head>

<!--
 * ===[ SECTION 03 ]=================================== *
 * HTML Body                                            *
 * ==================================================== */ 
-->

<body>
    <header>
        <h1>Neighborhood Information Database</h1>
    </header>

    <div id="main-container" name="MainContainer">
    <!-- Button Container -->
    <div id="left-sidebar" name="QueryContainer">
        <button onclick="read_button('query1')">Lookup All House Addresses by Neighborhood Name</button>
        <button onclick="read_button('query2')">Lookup All Residents by Neighborhood Name</button>
        <button onclick="read_button('query3')">Lookup All Crimes by Neighborhood Name</button>
        <button onclick="read_button('query4')">Lookup Neighborhood by House Address Number</button>
        <button onclick="read_button('query5')">Lookup Residents by House Address Number</button>
        <button onclick="read_button('query6')">Lookup House Information by House Address</button>
        <button onclick="read_button('query7')">Show All Neighborhood</button>
    </div>

    <!-- Center Container -->
    <div id="center" name="InputContainer">
        <p id="content-title">No Selection</p>
        <p id="content-body">Start a database search by selecting an option on the left sidebar.</p>
    </div>

    <!-- Filler Container -->
    <div id="right-sidebar" name="FillerContainer"></div>

    </div>

    <!--
    * ===[ SECTION 04 ]=================================== *
    * HTML JavaScript                                      *
    * ==================================================== */ 
    -->
    <script>

        //Change Title Function
        function change_title(TITLE) {
            let CENTER_TITLE = document.getElementById("content-title");
            CENTER_TITLE.innerHTML = TITLE;
            return;
        }


        //Select All Container Function
        function select_all(KEY) {
            //Create HTML Form Element
            let container = document.createElement("form");
            container.setAttribute("action", "447_project_php.php");
            container.setAttribute("method", "POST");

            //Declare Input for Key
            let input_key = document.createElement("input");
            input_key.type = "hidden";
            input_key.name = "query_key";
            input_key.value = KEY;

            //Declare Submit Button Property
            let button_element = document.createElement("button");
            button_element.type = "submit";
            button_element.textContent = "Search";

            //Merge Elements Together
            container.appendChild(input_key);
            container.appendChild(button_element);

            return container;
        }

        //Build Input Container Function
        function build_input(KEY, PLACEHOLDER_TEXT) {
            //Create HTML Form Element
            let container = document.createElement("form");
            container.setAttribute("action", "447_project_php.php");
            container.setAttribute("method", "POST");
            
            //Declare Input Property
            let input_element = document.createElement("input");
            input_element.type = "text";
            input_element.placeholder = PLACEHOLDER_TEXT;
            input_element.name = "user_search";

            //Declare Input for Key
            let input_key = document.createElement("input");
            input_key.type = "hidden";
            input_key.name = "query_key";
            input_key.value = KEY;

            //Declare Submit Button Property
            let button_element = document.createElement("button");
            button_element.type = "submit";
            button_element.textContent = "Search";

            //Merge Elements Together
            container.appendChild(input_element);
            container.appendChild(input_key);
            container.appendChild(button_element);

            return container;
        }

        //Clear Center Content Function
        function clear_center(CENTER_CONTENT) {
            let input_id_select = document.getElementById("user_input");
            CENTER_CONTENT.innerHTML = "";
            if (input_id_select) input_id_select.remove();
            return;
        }

        //Read Button Input Function
        function read_button(KEY) {
            //Local Variable
            let CENTER_CONTENT = document.getElementById("content-body");

            //Query Switch
            switch(KEY) {
                case "query1":
                    change_title("Search All Houses in Neighborhood");
                    clear_center(CENTER_CONTENT);
                    CENTER_CONTENT.appendChild(build_input(KEY, "Enter Neighborhood Name"));
                    break;
                case "query2":
                    change_title("Search All Residents in Neighborhood");
                    clear_center(CENTER_CONTENT);
                    CENTER_CONTENT.appendChild(build_input(KEY, "Enter Neighborhood Name"));
                    break;
                case "query3":
                    change_title("Search All Crime in Neighborhood");
                    clear_center(CENTER_CONTENT);
                    CENTER_CONTENT.appendChild(build_input(KEY, "Enter Neighborhood Name"));
                    break;
                case "query4":
                    change_title("Search For a Neighborhood With House Address Number");
                    clear_center(CENTER_CONTENT);
                    CENTER_CONTENT.appendChild(build_input(KEY, "Enter Residential Address Number"));
                    break;
                case "query5":
                    change_title("Search House Owner With House Address Number");
                    clear_center(CENTER_CONTENT);
                    CENTER_CONTENT.appendChild(build_input(KEY, "Enter Residential Address Number"));
                    break;
                case "query6":
                    change_title("Search House Information With House Address Number");
                    clear_center(CENTER_CONTENT);
                    CENTER_CONTENT.appendChild(build_input(KEY, "Enter Residential Address Number"));
                    break;
                case "query7":
                    change_title("Search All Neighborhoods & Zip Code in Database");
                    clear_center(CENTER_CONTENT);
                    CENTER_CONTENT.appendChild(select_all(KEY));
                    break;
            }
            return;
        }

    </script>

</body>
</html>
